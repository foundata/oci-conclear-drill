# Single-image configuration for ConClear's repeat-release lifecycle network
# test. `drill/lifecycle-fixture.sh` installs it as the `conclear.toml` of a
# throwaway clone. The image is deliberately minimal and deterministic: the
# test releases the same revision and version twice and requires an identical
# image digest.
schema_version = 1

[project]
name = "oci-conclear-drill"
source = "https://foundata.com/en/projects/oci-conclear-drill/#source"

[[project.version_sources]]
kind = "changelog"
path = "CHANGELOG.md"

[[images]]
id = "lifecycle"
containerfile = "Containerfile.lifecycle"
repository = "quay.io/conclear-drill/drill-lifecycle"
platforms = ["linux/amd64"]

[[images.pins]]
reference = "docker.io/library/busybox:stable-musl"
tag_intent = "moving-release-line"

[images.release]
version_tags = ["{version}"]
moving_tags = ["latest"]

[images.runtime]
profile = "service"
user = 1001
writable_mounts = ["/run/conclear-drill"]
# A single BusyBox process; the margin covers the readiness probe.
memory = "32MiB"
cpus = 1.0
pids = 16
nofile = 64
health_command = ["/usr/local/lib/conclear-drill/healthcheck.sh"]
immutable_paths = ["/usr/local/lib/conclear-drill"]
startup_timeout_seconds = 60
shutdown_timeout_seconds = 15
