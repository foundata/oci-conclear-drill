schema_version = 1

[project]
name = "oci-conclear-drill"
source = "https://foundata.com/en/projects/oci-conclear-drill/#source"

# Every drill release states its version in the changelog and as a Git tag.
[[project.version_sources]]
kind = "changelog"
path = "CHANGELOG.md"

[[project.version_sources]]
kind = "git-tag"
pattern = "v{version}"

# -----------------------------------------------------------------------------
# service: long-running process with health command, test material from the
# helper image, functional sudo tests, a configuration exception and hooks.
# -----------------------------------------------------------------------------
[[images]]
id = "service"
repository = "quay.io/conclear-drill/drill-service"
platforms = ["linux/amd64", "linux/arm64"]

[images.test.sudo]
user = 1001
denied_user = 65534
command = ["/usr/bin/id", "-u"]
expected_stdout = "0\n"

[[images.hooks]]
name = "inspect-layout"
command = ["hooks/inspect-layout.sh"]
timeout_seconds = 120

[[images.hooks]]
name = "run-from-layout"
command = ["hooks/run-from-layout.sh"]
timeout_seconds = 600

[[images.hooks]]
name = "optional-absent"
command = ["hooks/absent.sh"]
required = false

[[images.pins]]
reference = "docker.io/library/debian:13-slim"
tag_intent = "moving-release-line"

[[images.configuration_exceptions]]
path = "usr/local/share/conclear-drill/examples/Dockerfile.example"
rationale = "Example Dockerfile shipped as documentation data; it is not this image's build definition and is never built."
owner = "foundata GmbH (https://foundata.com)"
review_trigger = "Review when the example changes or the scanner's Dockerfile checks change."
expires = "2027-09-30"

[images.release]
version_tags = ["{version}"]
moving_tags = ["latest"]

[images.runtime]
profile = "service"
user = 1001
writable_mounts = ["/run/conclear-drill"]
# Provisional until the first drill reports the observed footprint.
memory = "128MiB"
cpus = 1.0
pids = 64
nofile = 512
health_command = ["/usr/local/lib/conclear-drill/healthcheck.sh"]
# sudo changes user and group IDs; without these the escalation probe fails.
capabilities = ["CAP_SETUID", "CAP_SETGID"]
immutable_paths = ["/usr/local/lib/conclear-drill", "/usr/local/share/conclear-drill"]
startup_timeout_seconds = 60
shutdown_timeout_seconds = 15

[images.runtime.sudo_requirement]
mode = "escalation"
scope = "Account 1001 may run /usr/bin/id -u as root; no other account may escalate."
rationale = "Drill the functional sudo tests with a minimal, exactly declared policy."
owner = "foundata GmbH (https://foundata.com)"
review_trigger = "Review when the policy file, the accounts or the sudo package change."


